{% extends "base.html" %}
{% block title %}로그인 · 정글 마니또{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
  <main id="main-content" class="auth-layout">
    <section class="auth-visual" aria-label="정글 마니또 소개">
      <a class="brand brand-light" href="{{ url_for('main.index') }}">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>정글 마니또</span>
      </a>
      <div class="auth-quote">
        <blockquote>“오늘도 누군가가<br>당신을 응원하고 있어요.”</blockquote>
      </div>
      <p class="visual-caption">익명의 다정함이 만드는 작은 변화</p>
    </section>

    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <h1 id="auth-title">로그인</h1>
        <p class="auth-description">마니또 카드와 새로운 소식을 확인하세요.</p>

        {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}

        <form class="auth-form" method="post" action="{{ url_for('main.login') }}">
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" value="{{ username or '' }}"
                   autocomplete="username" placeholder="아이디를 입력하세요" required autofocus>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="비밀번호를 입력하세요" required>
          </div>
          <button class="button button-primary button-full" type="submit">로그인</button>
        </form>

        <p class="auth-switch">아직 계정이 없나요? <a href="{{ url_for('main.signup') }}">회원가입</a></p>
      </div>
    </section>
  </main>
{% endblock %}
