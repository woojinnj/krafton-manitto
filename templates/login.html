<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}


/* 로고부터 로그인 버튼까지 전체 */
.login-container {
    width: 380px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ㅁㄴㄸ 로고 */
.button_logo {
    margin-bottom: 50px;
}

.index-link {
    color: #03c75a;
    font-size: 42px;
    font-weight: 900;
    text-decoration: none;
    letter-spacing: -3px;
}


/* ID/PW/로그인 */
.login-form {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 20px;
}


/* ID, PW */
.login-input {
    width: 100%;
    height: 70px;

    padding: 0 18px;

    border: 1px solid #ddd;

    font-size: 28px;
    box-sizing: border-box;
}


/* 로그인 버튼 */
.login-button {
    width: 100%;
    height: 70px;

    margin-top: 20px;

    background-color: white;

    border: 4px solid black;

    font-size: 32px;
    font-weight: bold;

    cursor: pointer;
}

    </style>
  </head>

  <body>
    
<body>

    <div class="login-container">

        <!-- 로고 -->
        <div class="button_logo">
            <a href="{{ url_for('index') }}" class="index-link">ㅁㄴㄸ</a>
        </div>

<!-- 로그인 -->
<form class="login-form" method="POST" action="/login">

    <input
        type="text"
        name="username"
        placeholder="ID"
        class="login-input"
    >
    
            <input
                type="password"
                name="password"
                placeholder="PW"
                class="login-input"
            >

            <button type="submit" class="login-button">
                로그인
            </button>

        </form>

    </div>

</body>
</html>
