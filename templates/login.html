<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 500px;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .login-form input {
            width: 100%;
            height: 70px;

            border: 2px solid #ddd;
            padding: 10px 15px;

            font-size: 30px;
        }

        .login-button {
            margin-top: 100px;

            width: 300px;
            height: 90px;

            border: 7px solid black;
            background-color: white;

            font-size: 50px;
            font-weight: bold;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <form
            class="login-form"
            method="POST"
            action="/login">

            <input
                type="text"
                name="username"
                placeholder="ID"
            >

            <input
                type="password"
                name="password"
                placeholder="PW"
            >

            <div>
                <button
                    type="submit"
                    class="login-button">
                    로그인
                </button>
            </div>

        </form>

    </div>

</body>
</html>
