<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard</title>

  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .main-area {
      width: 75%;
      padding: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flip {
    width: 500px;
    height: 500px;
    perspective: 1100px;
    margin-bottom: 30px;
}

.manitto-card {
    width: 100%;
    height: 100%;

    position: relative;

    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.card-front,
.card-back {
    position: absolute;

    width: 100%;
    height: 100%;

    backface-visibility: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.card-front {
    background-color: red;
}

.card-back {
    background-color: royalblue;
    color: white;

    transform: rotateY(180deg);
}

/* 카드가 뒤집힌 상태 */
.manitto-card.flipped {
    transform: rotateY(180deg);
}

.star-rating {
  display: flex;
  flex-direction: row-reverse;
  font-size: 2.25rem;
  line-height: 2.5rem;
  justify-content: space-around;
  padding: 0 0.2em;
  text-align: center;
  width: 5em;
}
 
.star-rating input {
  display: none;
}
 
.star-rating label {
  -webkit-text-fill-color: transparent; /* Will override color (regardless of order) */
  -webkit-text-stroke-width: 2.3px;
  -webkit-text-stroke-color: #2b2a29;
  cursor: pointer;
}
 
.star-rating :checked ~ label {
  -webkit-text-fill-color: gold;
}
 
.star-rating label:hover,
.star-rating label:hover ~ label {
  -webkit-text-fill-color: #fff58c;
}

    .button-area {
      display: flex;
      gap: 100px;
    }

    .button-area button {
      width: 200px;
      height: 60px;
      background-color: white;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 20px;
    }

    .sidebar {
      width: 25%;
      min-height: 100vh;
      border-left: 1px solid #ddd;
    }

    .profile-area {
      background-color: #c8ff8c;
      padding: 30px;
      height: 500px;
    }

    .profile-top {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .username-box,
    .name-box {
        flex: 1;
        height: 40px;
        width: 130px;
        padding: 15px;
        background-color: white;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
    }

    .profile-info {
      background-color: white;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 20px;
      height: 80px;
      text-align: center;
    }

    .profile-info p {
      margin-bottom: 15px;
    }

    .logout-button {
      width: 160px;
      height: 45px;
      display: block;
      margin: 0 auto;
      background-color: white;
      border: none;
      cursor: pointer;
      font-size: 20px;
    }

    .ranking-area {
      background-color: white;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .ranking-table th,
    .ranking-table td {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .ranking-table th {
      background-color: #f5f5f5;
    }

.rating-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.star-rating {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
}

.star-rating input {
    display: none;
}

.star {
    font-size: 45px;
    color: #333;
    cursor: pointer;
}

#rating-emoji {
    font-size: 35px;
    display: inline-block;
}

/* 마우스를 올렸을 때 */
.star-rating label:hover,
.star-rating label:hover ~ label {
    color: gold;
}

/* 클릭했을 때 */
.star-rating input:checked ~ label {
    color: gold;
}

  </style>

  </head>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>

    <style>
        /* CSS */
    </style>


<body>

    <main class="main-area">

        <div class="flip">
            <div class="manitto-card" id="manitto-card">

                <div class="card-front">
                    <h2>마니또</h2>
                    <p>버튼을 눌러 확인하세요!</p>
                </div>

                <div class="card-back">

                    <h2 id="card-title">내 마니또</h2>

                    <p>이름 : <span id="card-name"></span></p>
                    <p>MBTI : <span id="card-mbti"></span></p>
                    <p>WANT : <span id="card-want"></span></p>

                    <div id="manitti-extra" style="display: none;">
    <div class="rating-wrap">

        <div class="star-rating">

            <input type="radio" id="5-stars" name="rating" value="5">
            <label for="5-stars" class="star" data-rating="5">★</label>

            <input type="radio" id="4-stars" name="rating" value="4">
            <label for="4-stars" class="star" data-rating="4">★</label>

            <input type="radio" id="3-stars" name="rating" value="3">
            <label for="3-stars" class="star" data-rating="3">★</label>

            <input type="radio" id="2-stars" name="rating" value="2">
            <label for="2-stars" class="star" data-rating="2">★</label>

            <input type="radio" id="1-star" name="rating" value="1">
            <label for="1-star" class="star" data-rating="1">★</label>

        </div>

        <span id="rating-emoji">🙂</span>

    </div>

    <button
        type="button"
        class="rating-submit-button"
        onclick="submitRating()"
    >
        별점 등록
    </button>
</div>

                </div>

            </div>


        <div class="button-area">

            <button onclick="showManitto()">
                마니또
            </button>

            <button onclick="showManitti()">
                마니띠
            </button>

            <button onclick="shuffleManitto()">
                마니또 배정
            </button>

        </div>

    </main>


    <aside class="sidebar">

        <section class="profile-area">

            <div class="profile-top">

                <div class="username-box">
                    {{ user.username }}
                </div>

                <div class="name-box">
                    {{user.name}}
                </div>

            </div>

            <div class="profile-info">
                <p>MBTI : {{ user.mbti }}</p>
                <p>갖고 싶은 것 : {{ user.want }}</p>
            </div>

            <button class="logout-button">
                            <a href="{{ url_for('index') }}" class="index-link">로그아웃</a>

            </button>

        </section>


        <section class="ranking-area">

            <table class="ranking-table">

                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>별점</th>
                    </tr>
                </thead>

                <tbody>

                    {% for rank_user in ranking %}

                    <tr>
                        <td>{{loop.index}}</td>
                        <td>{{ rank_user.name }}</td>
                        <td>{{ "%.1f"|format(rank_user.ranking) }}</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </section>

    </aside>

    <script>
        function showManitto() {
        const card = document.getElementById("manitto-card");

        $.ajax({
            type: "GET",
            url: "/dashboard/showManitto",

            success: function(response) {
                if (response.result === "success") {
                    document.getElementById("card-title").innerText = "내 마니또";
                    document.getElementById("card-name").innerText = response.user.name;
                    document.getElementById("card-mbti").innerText = response.user.mbti;
                    document.getElementById("card-want").innerText = response.user.want;

                    document.getElementById("manitti-extra").style.display = "none";

                    card.classList.add("flipped");
                } else {
                    alert(response.message);
                }
            }
        });
    }

        function showManitti() {
            const card = document.getElementById("manitto-card");

            $.ajax({
                type: "GET",
                url: "/dashboard/showManitti",

                success: function(response) {
                    if (response.result === "success") {
                        document.getElementById("card-title").innerText = "내 마니띠";
                        document.getElementById("card-name").innerText = response.user.name;
                        document.getElementById("card-mbti").innerText = response.user.mbti;
                        document.getElementById("card-want").innerText = response.user.want;

                        document.getElementById("manitti-extra").style.display = "block";

                        card.classList.add("flipped");
                    } else {
                        alert(response.message);
                    }
                }
            });
        }
        function shuffleManitto() {
          $.ajax({
              type: "POST",
              url: "/api/shuffle",

              success: function(response) {
                  if (response.result === "success") {
                      alert("마니또 배정이 완료되었습니다.");
                  } else {
                      alert("마니또 배정에 실패했습니다.");
                  }
              },

              error: function() {
                  alert("서버 요청 중 오류가 발생했습니다.");
              }
          });
      }
    </script>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
