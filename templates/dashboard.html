<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard</title>

  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .main-area {
      width: 75%;
      padding: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flip {
    width: 500px;
    height: 500px;
    perspective: 1100px;
    margin-bottom: 30px;
}

.manitto-card {
    width: 100%;
    height: 100%;

    position: relative;

    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.card-front,
.card-back {
    position: absolute;

    width: 100%;
    height: 100%;

    backface-visibility: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.card-front {
    background-color: red;
}

.card-back {
    background-color: royalblue;
    color: white;

    transform: rotateY(180deg);
}

/* 카드가 뒤집힌 상태 */
.manitto-card.flipped {
    transform: rotateY(180deg);
}

    .button-area {
      display: flex;
      gap: 100px;
    }

    .button-area button {
      width: 200px;
      height: 60px;
      background-color: white;
      border: 1px solid #555;
      cursor: pointer;
    }

    .sidebar {
      width: 25%;
      min-height: 100vh;
      border-left: 1px solid #ddd;
    }

    .profile-area {
      background-color: #c8ff8c;
      padding: 30px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .profile-image {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #ddd;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .name-box {
      width: 130px;
      padding: 15px;
      background-color: white;
      text-align: center;
    }

    .profile-info {
      background-color: white;
      margin-bottom: 15px;
      padding: 10px;
    }

    .profile-info p {
      margin-bottom: 15px;
    }

    .logout-button {
      width: 160px;
      height: 45px;
      display: block;
      margin: 0 auto;
      background-color: white;
      border: none;
      cursor: pointer;
    }

    .ranking-area {
      background-color: white;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .ranking-table th,
    .ranking-table td {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .ranking-table th {
      background-color: #f5f5f5;
    }

  </style>

  </head>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>

    <style>
        /* CSS */
    </style>
</head>

<body>

    <main class="main-area">

        <div class="flip">
            <div class="manitto-card" id="manitto-card">

                <div class="card-front">
                    <h2>마니또</h2>
                    <p>버튼을 눌러 확인하세요!</p>
                </div>

                <div class="card-back">

                    <h2 id="card-title">내 마니또</h2>

                    <p>
                        이름 :
                        <span id="card-name"></span>
                    </p>

                    <p>
                        MBTI :
                        <span id="card-mbti"></span>
                    </p>

                    <p>
                        WANT :
                        <span id="card-want"></span>
                    </p>

                </div>

            </div>
        </div>


        <div class="button-area">

            <button onclick="showManitto()">
                내 마니또
            </button>

            <button onclick="showManitti()">
                내 마니띠
            </button>

        </div>

    </main>


    <aside class="sidebar">

        <section class="profile-area">

            <div class="profile-top">

                <div class="profile-image">
                    사진
                </div>

                <div class="name-box">
                    {{ user.name }}
                </div>

            </div>

            <div class="profile-info">
                <p>MBTI : {{ user.mbti }}</p>
                <p>WANT : {{ user.want }}</p>
            </div>

            <button class="logout-button">
                            <a href="{{ url_for('index') }}" class="index-link">로그아웃</a>

            </button>

        </section>


        <section class="ranking-area">

            <table class="ranking-table">

                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>별점</th>
                    </tr>
                </thead>

                <tbody>

                    {% for user in ranking %}

                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ user.name }}</td>
                        <td>{{ user.ranking }}</td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </section>

    </aside>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        function showManitto() {
            const card = document.getElementById("manitto-card");

            document.getElementById("card-title").innerText = "내 마니또";
            document.getElementById("card-name").innerText = "이지민";
            document.getElementById("card-mbti").innerText = "ENFP";
            document.getElementById("card-want").innerText = "초콜릿 주세요";

            card.classList.add("flipped");
        }

        function showManitti() {
            const card = document.getElementById("manitto-card");

            document.getElementById("card-title").innerText = "내 마니띠";
            document.getElementById("card-name").innerText = "현나";
            document.getElementById("card-mbti").innerText = "ISTJ";
            document.getElementById("card-want").innerText = "커피 주세요";

            card.classList.add("flipped");
        }
    </script>

</body>

</html>
