<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dashboard</title>

  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .main-area {
      width: 75%;
      padding: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-image {
      width: 500px;
      height: 500px;
      background-color: #c8ff8c;
      margin-bottom: 30px;
    }

    .button-area {
      display: flex;
      gap: 100px;
    }

    .button-area button {
      width: 200px;
      height: 60px;
      background-color: white;
      border: 1px solid #555;
      cursor: pointer;
    }

    .sidebar {
      width: 25%;
      min-height: 100vh;
      border-left: 1px solid #ddd;
    }

    .profile-area {
      background-color: #c8ff8c;
      padding: 30px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }

    .profile-image {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #ddd;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .name-box {
      width: 130px;
      padding: 15px;
      background-color: white;
      text-align: center;
    }

    .profile-info {
      background-color: white;
      margin-bottom: 15px;
      padding: 10px;
    }

    .profile-info p {
      margin-bottom: 15px;
    }

    .logout-button {
      width: 160px;
      height: 45px;
      display: block;
      margin: 0 auto;
      background-color: white;
      border: none;
      cursor: pointer;
    }

    .ranking-area {
      background-color: white;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .ranking-table th,
    .ranking-table td {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .ranking-table th {
      background-color: #f5f5f5;
    }

  </style>

  </head>

<body>
    <button onclick="shuffle()">셔플합니다!</button>
  </body>

  <body>
    <main class="main-area">
      <div class="main-image">
        이미지
      </div>
      <div class="button-area">
        <button>마니또</button>
        <button>마니띠</button>
      </div>
    </main>

    <aside class="sidebar">
      <section class="profile-area">
        <div class="profile-top">
          <div class="profile-image">
            사진
          </div>
          <div class="name-box">
            이름
          </div>
        </div>
        <div class="profile-info">
          <p>MBTI</p>
          <p>바라는점</p>
        </div>
        <button class="logout-button">로그아웃</button>
      </section>

      <section class="ranking-area">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>별점</th>
            </tr>
          </thead>

          이름
        </div>
    </aside>
    </aside>
    <aside class="profile-area">
      <section class="profile-area">
        프로필
      </section>
      <section class="ranking-area">
        랭킹
      </section>
    </aside>"
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <script>
    // HTML이 다 준비된 뒤 실행
    $(document).ready(function () {
      showMemos();
    });

    // 수정중임
    function shuffle() {
      $.ajax({
        type: "POST",
        url: "/api/shuffle", // 셔플 요청 api 함수는 app에서 만들예정
        success: function (response) {
          alert("셔플되었습니다!");
          location.reload(); //페이지 새로고침
        },
      });
    }
  </script>
</html>
