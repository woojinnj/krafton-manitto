<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .signup-container {
            width: 380px;
            text-align: center;
        }

/* ㅁㄴㄸ 로고 */
.button_logo {
    margin-bottom: 50px;
}

.index-link {
    color: #03c75a;
    font-size: 42px;
    font-weight: 900;
    text-decoration: none;
    letter-spacing: -3px;
}

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .signup-input,
        .signup-select {
            width: 100%;
            height: 50px;

            padding: 10px 15px;
            border: 1px solid #ddd;

            font-size: 16px;
        }

        .signup-button {
            width: 200px;
            height: 60px;

            margin: 30px auto 0;

            background-color: white;
            border: 4px solid black;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-link {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="button_logo">
            <a href="{{ url_for('index') }}" class="index-link">ㅁㄴㄸ</a>
        </div>

        <form
            class="signup-form"
            method="POST"
            action="/signup"
        >

            <input
                type="text"
                name="username"
                class="signup-input"
                placeholder="ID"
            >

            <input
                type="password"
                name="password"
                class="signup-input"
                placeholder="PW"
            >

            <input
                type="text"
                name="name"
                class="signup-input"
                placeholder="NAME"
            >

            <select
                name="mbti"
                class="signup-select"
            >
                <option value="ISTJ">ISTJ</option>
                <option value="ISFJ">ISFJ</option>
                <option value="INFJ">INFJ</option>
                <option value="INTJ">INTJ</option>

                <option value="ISTP">ISTP</option>
                <option value="ISFP">ISFP</option>
                <option value="INFP">INFP</option>
                <option value="INTP">INTP</option>

                <option value="ESTP">ESTP</option>
                <option value="ESFP">ESFP</option>
                <option value="ENFP">ENFP</option>
                <option value="ENTP">ENTP</option>

                <option value="ESTJ">ESTJ</option>
                <option value="ESFJ">ESFJ</option>
                <option value="ENFJ">ENFJ</option>
                <option value="ENTJ">ENTJ</option>
            </select>

            <input
                type="text"
                name="want"
                class="signup-input"
                placeholder="WANT"
            >

            <button
                type="submit"
                class="signup-button"
            >
                회원가입
            </button>

        </form>

    </div>

</body>

</html>
