<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="button-logo">
            <a
                href="{{ url_for('index') }}"
                class="index-link"
            >
                ㅁㄴㄸ
            </a>
        </div>


        {% if error %}
            <p class="form-error">
                {{ error }}
            </p>
        {% endif %}


        <form
            class="auth-form"
            method="POST"
            action="{{ url_for('signup') }}"
        >

            <input
                type="text"
                name="username"
                class="auth-input"
                placeholder="ID"
                value="{{ username or '' }}"
                required
                maxlength="20"
            >

            <input
                type="password"
                name="password"
                class="auth-input"
                placeholder="PW"
                required
                maxlength="20"
            >

            <input
                type="text"
                name="name"
                class="auth-input"
                placeholder="NAME"
                value="{{ name or '' }}"
                required
                maxlength="20"
            >


            <select
                name="mbti"
                class="auth-select"
                required
            >

                <option value="ISTJ" {% if mbti == "ISTJ" %}selected{% endif %}>ISTJ</option>
                <option value="ISFJ" {% if mbti == "ISFJ" %}selected{% endif %}>ISFJ</option>
                <option value="INFJ" {% if mbti == "INFJ" %}selected{% endif %}>INFJ</option>
                <option value="INTJ" {% if mbti == "INTJ" %}selected{% endif %}>INTJ</option>

                <option value="ISTP" {% if mbti == "ISTP" %}selected{% endif %}>ISTP</option>
                <option value="ISFP" {% if mbti == "ISFP" %}selected{% endif %}>ISFP</option>
                <option value="INFP" {% if mbti == "INFP" %}selected{% endif %}>INFP</option>
                <option value="INTP" {% if mbti == "INTP" %}selected{% endif %}>INTP</option>

                <option value="ESTP" {% if mbti == "ESTP" %}selected{% endif %}>ESTP</option>
                <option value="ESFP" {% if mbti == "ESFP" %}selected{% endif %}>ESFP</option>
                <option value="ENFP" {% if mbti == "ENFP" %}selected{% endif %}>ENFP</option>
                <option value="ENTP" {% if mbti == "ENTP" %}selected{% endif %}>ENTP</option>

                <option value="ESTJ" {% if mbti == "ESTJ" %}selected{% endif %}>ESTJ</option>
                <option value="ESFJ" {% if mbti == "ESFJ" %}selected{% endif %}>ESFJ</option>
                <option value="ENFJ" {% if mbti == "ENFJ" %}selected{% endif %}>ENFJ</option>
                <option value="ENTJ" {% if mbti == "ENTJ" %}selected{% endif %}>ENTJ</option>

            </select>


            <input
                type="text"
                name="want"
                class="auth-input"
                placeholder="WANT"
                value="{{ want or '' }}"
                required
                maxlength="100"
            >


            <button
                type="submit"
                class="auth-button"
            >
                회원가입
            </button>

        </form>

    </div>

</body>

</html>
