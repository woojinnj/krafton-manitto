<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>signup</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
      }

      .signup-container {
        width: 500px;
        text-align: center;
      }

      .signup-form {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .signup-form input {
        width: 100%;
        height: 60px;

        border: 2px solid #ddd;
        padding: 10px 15px;

        font-size: 25px;
      }

      .signup-form select {
        width: 100%;
        height: 60px;

        border: 2px solid #ddd;
        padding: 10px 15px;

        font-size: 25px;
      }

      .signup-button {
        margin-top: 60px;

        width: 300px;
        height: 90px;

        border: 7px solid black;
        background-color: white;

        font-size: 45px;
        font-weight: bold;

        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="signup-container">
      <form class="signup-form" method="POST" action="/signup">
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
        <input
          type="text"
          name="username"
          placeholder="ID"
          value="{{ username or '' }}"
        />
        <input type="password" name="password" placeholder="PW" />
        <input
          type="text"
          name="name"
          placeholder="NAME"
          value="{{ name or '' }}"
        />

        <select name="mbti" id="mbti">
            <option value="ISTJ" {% if mbti == "ISTJ" %}selected{% endif %}>ISTJ</option>
            <option value="ISFJ" {% if mbti == "ISFJ" %}selected{% endif %}>ISFJ</option>
            <option value="INFJ" {% if mbti == "INFJ" %}selected{% endif %}>INFJ</option>
            <option value="INTJ" {% if mbti == "INTJ" %}selected{% endif %}>INTJ</option>
            <option value="ISTP" {% if mbti == "ISTP" %}selected{% endif %}>ISTP</option>
            <option value="ISFP" {% if mbti == "ISFP" %}selected{% endif %}>ISFP</option>
            <option value="INFP" {% if mbti == "INFP" %}selected{% endif %}>INFP</option>
            <option value="INTP" {% if mbti == "INTP" %}selected{% endif %}>INTP</option>
            <option value="ESTP" {% if mbti == "ESTP" %}selected{% endif %}>ESTP</option>
            <option value="ESFP" {% if mbti == "ESFP" %}selected{% endif %}>ESFP</option>
            <option value="ENFP" {% if mbti == "ENFP" %}selected{% endif %}>ENFP</option>
            <option value="ENTP" {% if mbti == "ENTP" %}selected{% endif %}>ENTP</option>
            <option value="ESTJ" {% if mbti == "ESTJ" %}selected{% endif %}>ESTJ</option>
            <option value="ESFJ" {% if mbti == "ESFJ" %}selected{% endif %}>ESFJ</option>
            <option value="ENFJ" {% if mbti == "ENFJ" %}selected{% endif %}>ENFJ</option>
            <option value="ENTJ" {% if mbti == "ENTJ" %}selected{% endif %}>ENTJ</option>
        </select>

        <input
          type="text"
          name="want"
          placeholder="WANT"
          value="{{ want or '' }}"
        />

        <div>
          <button type="submit" class="signup-button">회원가입</button>
          <a href="/login" class="login-link">로그인하러 가기</a>
        </div>
      </form>
    </div>
  </body>
</html>
